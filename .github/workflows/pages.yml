name: Build and verify

# GitHub Pages for this repository is configured as a legacy build from branch
# `main`, path `/`. This workflow guarantees that nothing broken reaches `main`:
# it validates the primary Zone2 site, its internal navigation and asset
# references, and the preserved companion sites (research-hub/, northstar/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site files, links and data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Primary site files exist
        run: |
          for f in index.html products.html analysis.html content.html compliance.html tracking.html flagged.html 404.html \
                   assets/css/style.css assets/js/data.js assets/js/app.js; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          echo "Primary site files present"

      - name: Internal links and asset references resolve
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          def check(root_dir, pages):
              root = Path(root_dir)
              problems = []
              class P(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.refs = []
                  def handle_starttag(self, tag, attrs):
                      a = dict(attrs)
                      if tag == "script" and "src" in a:
                          self.refs.append(a["src"])
                      if tag == "link" and a.get("rel") == "stylesheet":
                          self.refs.append(a["href"])
                      if tag == "a" and a.get("href") and not a["href"].startswith(("http", "#", "mailto:")):
                          self.refs.append(a["href"])
              for page in pages:
                  p = P()
                  p.feed((root / page).read_text(encoding="utf-8"))
                  for ref in p.refs:
                      target = (root / ref).resolve()
                      if not target.is_file():
                          problems.append(f"{root_dir}/{page}: missing {ref}")
              return problems

          problems = []
          problems += check(".", ["index.html","products.html","analysis.html","content.html","compliance.html","tracking.html","flagged.html","404.html"])
          problems += check("research-hub", [f.name for f in Path("research-hub").glob("*.html")])
          problems += check("northstar", ["index.html"])
          if problems:
              print("\n".join(problems))
              raise SystemExit(1)
          print("All internal links and assets resolve")
          PY

      - name: Primary dataset is well-formed
        run: |
          node --check assets/js/data.js && node --check assets/js/app.js && echo "JS syntax OK"

      - name: Companion data files parse
        run: |
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob('research-hub/data/*.json')):
              json.load(open(f, encoding='utf-8'))
              print(f'ok   {f}')
          for f in ['research-hub/site-manifest.json']:
              json.load(open(f, encoding='utf-8'))
              print(f'ok   {f}')
          print("Companion data files parse")
          PY
