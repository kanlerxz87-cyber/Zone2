name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files and internal navigation
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s data.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              ids=set()
              refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='script' and 'src' in a: self.refs.append(a['src'])
                  if tag=='link' and a.get('rel')=='stylesheet': self.refs.append(a['href'])
          p=Check(); p.feed(Path('index.html').read_text())
          missing=[x for x in p.refs if not Path(x).is_file()]
          assert not missing, f'Missing asset files: {missing}'
          assert {'app','nav','crumb'} <= p.ids
          js=Path('app.js').read_text()
          assert all(f'data-page="{x}"' in Path('index.html').read_text() for x in ('overview','products','content','optimization','compliance','flagged'))
          assert 'window.ZONE2_DATA' in Path('data.js').read_text()
          print('Static site assets and navigation validated')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
