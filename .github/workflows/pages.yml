name: Build and verify

# This repository's GitHub Pages site is configured as a *legacy* build from
# branch `main`, path `/`. Changing that to the Actions build type requires
# repository-admin rights, so the workflow's job is to guarantee that nothing
# unverified can reach `main` in the first place. Pages then publishes the
# merge commit automatically.
#
# The generated pages are committed at the repo root, per site-manifest.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify data and generated site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every JSON file parses
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in sorted(glob.glob('data/*.json')):
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f'ok   {f}')
              except Exception as exc:
                  bad.append(f'{f}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          PY

      - name: Rebuild the site
        run: python3 scripts/build.py

      - name: Committed output must match a fresh build
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'python3 scripts/build.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Committed output matches a fresh build."

      - name: Verify sources, links, disclosure and the no-price rule
        run: python3 scripts/verify.py

      - name: Verify the checker itself fails on bad input
        run: |
          # Prove the guard actually guards: introduce an unsourced row and
          # confirm the verifier rejects it.
          cp data/products.json /tmp/products.json.bak
          python3 - <<'PY'
          import json
          doc = json.load(open('data/products.json'))
          doc['products'][0]['specs'].append({
              'label': 'Deliberately broken row',
              'value': 'x',
              'status': 'verified',
              'source_name': 'none',
              'source_url': None,
          })
          json.dump(doc, open('data/products.json', 'w'))
          PY
          python3 scripts/build.py > /dev/null
          if python3 scripts/verify.py > /tmp/out.txt 2>&1; then
            echo "::error::verify.py passed an unsourced verified row — the guard is broken"
            exit 1
          fi
          echo "Guard correctly rejected the unsourced row:"
          cat /tmp/out.txt
          cp /tmp/products.json.bak data/products.json
          python3 scripts/build.py > /dev/null
          python3 scripts/verify.py
