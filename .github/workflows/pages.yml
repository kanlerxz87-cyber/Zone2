name: Build, verify and deploy

# Publication integration T63: deploy only the checked _site artifact using Pages Actions.
# All historical namespace gates remain. Do not upload the raw checkout or private data.
# This workflow checks:
#   - the primary Zone2 platform (repo root) is complete and its internal links resolve
#   - the companion sites (research-hub/, northstar/, zone2/) are complete
#   - no page prints a price, and every page carries the static affiliate disclosure
#   - all data files parse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# T63 (session 10727edd, 2026-11-19): one group PER REF. With a single global `pages` group,
# any session's pull-request run cancelled every other session's run, including the gate on
# main (observed: run 44468560526, PR #164, cancelled 29 s in by another branch's run).
# T63 37333afd: do not cancel running checks, even on a newer push. Deploys are serialised
# separately by the job-level group on `deploy` below, which never cancels.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Primary site files exist
        run: |
          for f in index.html products.html analysis.html content.html compliance.html tracking.html flagged.html 404.html \
                   assets/css/style.css assets/js/data.js assets/js/app.js; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          echo "Primary site files present"

      - name: Internal links and asset references resolve (all sites)
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          def check(root_dir, pages):
              root = Path(root_dir)
              problems = []
              class P(HTMLParser):
                  def __init__(self):
                      super().__init__(); self.refs = []
                  def handle_starttag(self, tag, attrs):
                      a = dict(attrs)
                      if tag == "script" and "src" in a:
                          self.refs.append(a["src"])
                      if tag == "link" and a.get("rel") == "stylesheet":
                          self.refs.append(a["href"])
                      if tag == "a" and a.get("href") and not a["href"].startswith(("http", "#", "mailto:")):
                          # A fragment (#F-01) addresses an element inside the target page, not a file.
                          self.refs.append(a["href"].split("#", 1)[0])
              for page in pages:
                  p = P()
                  p.feed((root / page).read_text(encoding="utf-8"))
                  for ref in p.refs:
                      base = (root / page).parent
                      if not (base / ref).resolve().is_file():
                          problems.append(f"{root_dir}/{page}: missing {ref}")
              return problems

          problems = []
          problems += check(".", ["index.html","products.html","analysis.html","content.html","compliance.html","tracking.html","flagged.html","404.html"])
          problems += check("research-hub", sorted(f.name for f in Path("research-hub").glob("*.html")))
          problems += check("northstar", ["index.html"])
          problems += check("zone2", sorted(f.name for f in Path("zone2").glob("*.html")))
          problems += check("affiliate-lab", sorted(f.name for f in Path("affiliate-lab").glob("*.html")))
          problems += check("revalidation", sorted(f.name for f in Path("revalidation").glob("*.html")))
          # T42: the Owner's Console resolves "../" links upward, so check it from the repo root too.
          problems += check("console", sorted(f.name for f in Path("console").glob("*.html")))
          # T49: the discovery review namespace (PR #104, integrated) is published like any other.
          problems += check("discovery", sorted(f.name for f in Path("discovery").glob("*.html")))
          # T60 (session arena/613900e6-zone2): the submitted-link intake namespace.
          problems += check("intake", sorted(f.name for f in Path("intake").glob("*.html")))
          # T58 (session arena/1bfbc559-zone2): check the decision board's links/assets,
          # including its sideways stylesheet and upward root-site references.
          problems += check("board", sorted(f.name for f in Path("board").glob("*.html")))
          problems += check(".", [f.name for f in sorted(Path(".").glob("*.html")) if f.name != "404.html"])
          for page in sorted(Path("pages").rglob("*.html")):
              rel = page.relative_to("pages")
              problems += check(page.parent, [page.name])
          # marketing/ has subdirectories (articles/), so refs must resolve relative to each page, not the root.
          class Q(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "script" and "src" in a: self.refs.append(a["src"])
                  if tag == "link" and a.get("rel") == "stylesheet": self.refs.append(a["href"])
                  if tag == "a" and a.get("href") and not a["href"].startswith(("http", "#", "mailto:")):
                      self.refs.append(a["href"])
          for page in sorted(Path("marketing").rglob("*.html")):
              q = Q(); q.feed(page.read_text(encoding="utf-8"))
              for ref in q.refs:
                  if not (page.parent / ref.split("#")[0]).resolve().is_file():
                      problems.append(f"{page}: missing {ref}")
          if problems:
              print("\n".join(problems))
              raise SystemExit(1)
          print("All internal links and assets resolve")
          PY

      - name: Primary dataset is well-formed
        run: |
          node --check assets/js/data.js && node --check assets/js/app.js && echo "JS syntax OK"

      - name: Data files parse
        run: |
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob('research-hub/data/*.json')) + \
                   sorted(glob.glob('zone2/data/*.json')) + \
                   sorted(glob.glob('affiliate-lab/data/*.json')) + \
                   sorted(glob.glob('revalidation/data/*.json')) + \
                   ['research-hub/site-manifest.json']:
              json.load(open(f, encoding='utf-8'))
              print(f'ok   {f}')
          PY

      - name: No page prints a price and every page discloses
        run: |
          python3 - <<'PY'
          import glob, re, sys
          DISCLOSURE = "As an Amazon Associate I earn from qualifying purchases."
          MONEY = re.compile(r'\$\s?\d[\d,]*(?:\.\d{1,2})?')
          PRICE_CONTEXT = re.compile(r'\b(price|pricing|current price|list price|buy|add to cart|deal|discount|sale|offer)\b', re.I)
          PROGRAM_CONTEXT = re.compile(r'\b(bounty|commission|income|payment|minimum|check|gift card|fee|earn|rate|trial|stream|tax|refund|withhold)\w*', re.I)
          bad = []
          pages = sorted(glob.glob('*.html')) + \
                  sorted(glob.glob('research-hub/*.html')) + \
                  sorted(glob.glob('northstar/*.html')) + \
                  sorted(glob.glob('zone2/*.html')) + \
                  sorted(glob.glob('revalidation/*.html')) + \
                  sorted(glob.glob('affiliate-lab/*.html')) + \
                  sorted(glob.glob('pages/**/*.html', recursive=True)) + \
                  sorted(glob.glob('console/*.html')) + \
                  sorted(glob.glob('discovery/*.html')) + \
                  sorted(glob.glob('intake/*.html'))
          assert len(pages) >= 70, f'expected every published page, found {len(pages)}'
          for f in pages:
              t = open(f, encoding='utf-8').read()
              if DISCLOSURE not in t:
                  bad.append(f'{f}: missing disclosure')
              # Context-aware price rule, identical to tools/validate_data.py and the affiliate-lab step:
              # a dollar figure is a forbidden PRODUCT price only inside a buying context (price/deal/buy...);
              # program economics (bounty, commission, payment minimum, processing fee) are permitted.
              units = [re.sub(r'<[^>]+>', ' ', u) for u in re.split(r'</tr>|</p>|</li>|<br\s*/?>', t)]
              for unit in units:
                  for m in MONEY.finditer(unit):
                      if PRICE_CONTEXT.search(unit) and not PROGRAM_CONTEXT.search(unit):
                          bad.append(f'{f}: money value {m.group(0)!r} in a buying context')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print(f'{len(pages)} pages: disclosure present, no prices printed')
          PY

      # ---- arena/181863ad-zone2: companion verification site ----
      - name: affiliate-lab discloses, links resolve, no product prices
        run: |
          python3 - <<'PY'
          import glob, re, sys
          from html.parser import HTMLParser
          from pathlib import Path
          DISCLOSURE = "As an Amazon Associate I earn from qualifying purchases."
          # Same rule as tools/validate_data.py: a dollar figure in a buying context is a
          # product price (forbidden); program economics (bounty/commission/rate rows) are not.
          MONEY = re.compile(r"\$\s?\d[\d,]*(?:\.\d{1,2})?")
          PRICE_CONTEXT = re.compile(r"\b(price|pricing|current price|list price|buy|add to cart|deal|discount|sale|offer)\b", re.I)
          PROGRAM_CONTEXT = re.compile(r"\b(bounty|commission|income|payment|minimum|check|gift card|fee|earn|rate|trial|stream|tax|refund|withhold)\w*", re.I)
          bad = []
          pages = sorted(glob.glob('affiliate-lab/*.html'))
          if not pages:
              bad.append('affiliate-lab: no pages found')
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs = []; self.ids = set()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "script" and "src" in a:
                      self.refs.append(a["src"])
                  if tag == "link" and a.get("rel") == "stylesheet":
                      self.refs.append(a["href"])
                  if tag == "a" and a.get("href") and not a["href"].startswith(("http", "#", "mailto:")):
                      # A fragment (#F-01) addresses an element inside the target page, not a file.
                      self.refs.append(a["href"].split("#", 1)[0])
                  # Any element id in this page is a valid anchor target.
                  if "id" in a:
                      self.ids.add(a["id"])
          for f in pages:
              t = open(f, encoding="utf-8").read()
              if DISCLOSURE not in t:
                  bad.append(f'{f}: missing disclosure')
              p = P(); p.feed(t)
              for ref in p.refs:
                  if not (Path("affiliate-lab") / ref).resolve().is_file():
                      bad.append(f'{f}: missing {ref}')
              # A row of a table, or a block of prose, is the unit of context.
              units = [re.sub(r"<[^>]+>", " ", u) for u in re.split(r"</tr>|</p>|</li>|<br\s*/?>", t)]
              for unit in units:
                  for m in MONEY.finditer(unit):
                      if PRICE_CONTEXT.search(unit) and not PROGRAM_CONTEXT.search(unit):
                          bad.append(f'{f}: money value {m.group(0)!r} in a buying context')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'{len(pages)} affiliate-lab pages: disclosure present, links resolve, no product prices')
          PY

      - name: affiliate-lab per-row sourcing verifier
        run: python3 affiliate-lab/scripts/verify_site.py

      # ---- arena/c6e94e8d-zone2: controlled revalidation site (T20) ----
      - name: Rebuild revalidation pages and confirm committed output is current
        run: python3 revalidation/scripts/build.py --check

      - name: Research hub — committed output matches its generator, and the hub verifier passes
        run: |
          python3 research-hub/scripts/build.py
          git diff --exit-code -- research-hub/ || { echo "research-hub output drifted from scripts/build.py"; exit 1; }
          python3 research-hub/scripts/verify.py

      - name: Revalidation gate (per-row sourcing, blank-or-flagged, links, disclosure, no product prices)
        run: python3 revalidation/scripts/verify.py

      # ---- arena/a3faf404-zone2: marketing content set (T-A1..A4) ----
      - name: Rebuild marketing pages and confirm committed output is current
        run: python3 tools/build_marketing.py --check

      - name: Marketing gate (per-row sourcing, disclosure, preview labels, no prices, links)
        run: python3 marketing/scripts/verify_marketing.py

      # ---- arena/f786c0d7-zone2: generated subpages under pages/ ----
      # Rebuild first, so "committed output matches a fresh build" is a real property of this repo
      # rather than something a reviewer has to trust.
      - name: Rebuild the subpages and confirm committed output is current
        run: python3 tools/build_site.py --check

      - name: Rebuild the root evidence views and confirm committed output is current
        run: python3 tools/build_root_views.py --check

      - name: Subpage gate (per-row sourcing, blank-or-flagged, links, disclosure, no product prices)
        run: python3 tools/validate_data.py

      - name: Platform guard tests
        run: python3 tests/test_pipeline.py

      # T26 (session 808a6840): the drift gates above prove HTML matches the ledger; they
      # cannot see a dead fragment, a specification sourced to a Page-Not-Found URL, a prose
      # count that disagrees with the register, or a published namespace with no inbound link.
      # This runs after the rebuild steps so it audits the freshly generated output.
      - name: Rebuild the executive summary and confirm committed output is current
        run: python3 tools/build_summary.py --check

      - name: Structural audit (fragments, spec sources, prose counts, orphans, disclosure)
        run: python3 tools/audit_site.py

      # ---- arena/156aae86-zone2: discoverability (T41) ----
      # audit_site.py above proves every page is reachable BY A LINK. Nothing proved a page was
      # reachable BY A CRAWLER, and on 2026-11-15 the root sitemap listed 16 of 115 published pages
      # (86% absent, including marketing/index.html, playbook.html and all 38 pages/*.html). That
      # file was hand-typed and nothing rebuilt it, so it drifted without a single red build.
      # These two steps close that class of defect: the sitemap is now derived from the tree, and
      # the audit fails on a missing page, a dead or duplicated <loc>, a robots.txt that blocks
      # what the sitemap advertises, a noindex page that is listed, a marketing page the marketing
      # sitemap misses, or a root page with a broken favicon. Both were negative-tested against
      # nine injected defects before being added here (docs/verification-156aae86.md).
      - name: Rebuild the sitemap and confirm committed output is current
        run: python3 tools/build_sitemap.py --check

      - name: Discoverability audit (sitemap coverage, robots, noindex, favicon, canonical)
        run: python3 tools/seo_audit.py

      # ---- arena/5d6d2254-zone2: the head-metadata contract (T42) ----
      # tools/seo_audit.py above reports a canonical that points at the wrong URL; this gate is what makes
      # there be a canonical at all. It fails if any page under the reader/evidence contract (root, pages/,
      # journal/, decisions/, marketing/) lacks a self-referencing canonical, og:type/site_name/title/url or
      # a description. Companion prototype namespaces are reported, never failed: folding them in is the
      # owner's open decision (MQ-08 / DS-12). Negative-tested 2026-11-15 by rewriting one canonical to a
      # sibling URL and by deleting an og:url: both runs failed and named the page.
      - name: Head-metadata contract (canonical + Open Graph identity on every indexed page)
        run: python3 tools/build_head_meta.py --audit

      # ---- arena/d0135100-zone2: the decision surface (T29) ----
      # Renders decisions/ and DECISIONS.md from ledger/{requirements,questions,suggestions}.json, then holds
      # the whole namespace to the project contract: every row sourced or explicitly flagged, an OPEN question
      # never carrying an answer, every proposal stating its evidence/cost/risk/blockers, counts derived
      # rather than typed, disclosure present, no price, links resolving. Verified to fail on purpose on
      # 2026-11-15 against eight injected defects (filled-in OPEN answer, MET-with-a-gap, missing
      # how_to_obtain, ADOPT without a decision note, unregistered source id, typed count drift, missing
      # disclosure, injected product price) before being added here.
      - name: Rebuild the decision namespace and confirm committed output is current
        run: python3 tools/build_decisions.py --check

      - name: Decision gate (sourcing, closed vocabulary, blockers, derived counts, disclosure, links)
        run: python3 tools/validate_decisions.py

      # ---- arena/2b07e526-zone2: the release-readiness board (T45) ----
      # RESTORED 2026-11-16 by session 224cc10c. This step was dropped from the workflow by commit
      # 80c9a55 (session f8e18ca8, "Independent audit"), whose message claimed "workflow (+4 steps)"
      # while the diff actually *replaced* this block with its own four. Nothing checked the
      # readiness board between that commit and 2026-11-16, which is why the board's typed counts
      # drifted from the tree twice (124 vs 126, then 126 vs 134) without a single red build.
      # One row per named requirement on Amazon's Application Review Process page (S23), each with the
      # official source and, where measurable, a count recomputed from this tree. The generator fails on a
      # row with no official source, a quote that is not on S23 as captured, a BLOCKED row with no named
      # blocker, a finding with no owner action, a count that disagrees with the tree, a missing
      # disclosure, a printed product price, or a broken local link. Verified to fail on purpose on
      # 2026-11-15 against 14 injected defects before being added here.
      - name: Rebuild the release-readiness board and confirm committed output is current
        run: python3 tools/build_readiness.py --check

      # The negative tests for the board above. A gate that has only ever passed is a claim, not a
      # control: 13 injected defects must each fire, and the unmutated register must be clean.
      - name: Release-readiness gate negative tests (13 injected defects must each fire)
        run: python3 tools/test_readiness.py

      # ---- arena/224cc10c-zone2: the discovery review namespace (T47, integrated by T49) ----
      # Six pages answering three questions the site had not put on one surface: what a line-by-line
      # review found (17 measured findings), what information is still missing (10 open questions),
      # and what could be done about it at what cost (14 proposals, none decided). Every row ends in
      # the official page it was read from, and the quote is printed beside the link.
      # PR #104 shipped this namespace with a second head-layer implementation, which put two canonical
      # links and two conflicting og:url values on every page; that implementation was discarded on
      # merge and the pages now carry the repository's single head contract.
      - name: Rebuild the discovery review and confirm committed output is current
        run: |
          python3 tools/build_discovery.py --check
          python3 tools/build_measurement.py --check

      - name: Discovery gate (sourcing, quotes, blank-or-flagged, derived counts, links, disclosure)
        run: python3 tools/validate_discovery.py

      # ---- arena/dc72a69e-zone2: the design-brief namespace (T50) ----
      # Two steps, added rather than folded into an existing step, so no session's gate is
      # altered by this one. The first is the drift check every generated namespace here has:
      # brief/*.html must equal a fresh render of brief/data/*.json. The second is the
      # contract itself.
      #
      # The contract holds this namespace to the same rules as the rest of the site, plus one
      # that exists because of FB-01 and FB-02: the measured counts the executive summary
      # prints are re-derived from the tree at gate time. Those two flags are rows on the
      # release-readiness board that typed '116 published HTML pages' and '72 pages link to
      # amazon.com/dp/' while the tree grew to 150 and 87, and no gate noticed, because the
      # numbers were typed into prose rather than measured. A summary that cannot drift is
      # the point, so the gate recomputes rather than trusting the file.
      #
      # What it fails on: a source id that resolves to nothing; a measurement row with no
      # stated method; an official row with no source; a carried row that does not say what
      # it carries; an open question whose answer has been filled in; a recorded choice that
      # is not one of the row's own options; a recommendation that names no option; a
      # blocker that is not on the register it names; a money figure; a missing disclosure;
      # a missing canonical; a broken local link; and a same-page anchor that addresses
      # nothing. Negative-tested 2026-11-16 against fourteen injected defects before being
      # added here — see docs/verification-dc72a69e.md.
      - name: Rebuild the design brief and confirm committed output is current
        run: python3 tools/build_brief.py --check

      - name: Design-brief gate (sourcing, blank-or-flagged, derived counts, board integrity, disclosure, links, no prices)
        run: python3 tools/validate_brief.py

      # Same rule as the readiness board's negative tests: a gate that has only ever passed is
      # a claim, not a control. Fourteen injected defects must each fire, and the unmutated
      # register must be clean. Case 13 (prose that contradicts the measured table) is the
      # one that caught a real defect on the deployed page: the state table said 150 pages
      # while three prose bullets still said 138.
      - name: Design-brief gate negative tests (14 injected defects must each fire)
        run: python3 tools/test_brief.py

      # ---- arena/613900e6-zone2: the submitted-link intake (T60) ----
      # The five-link intake keeps product intent separate from observed redirect targets.
      # Its build, source/intent gate and negative tests all run before publication.
      - name: Rebuild the submitted-link intake and confirm committed output is current
        run: python3 tools/build_intake.py --check

      - name: Intake gate (intent/observation separation, sourcing, nothing-decided, derived counts, links, fragments, disclosure, no prices)
        run: python3 tools/validate_intake.py

      - name: Intake gate negative tests (15 injected defects must each fire)
        run: python3 tools/test_intake.py

      # ---- arena/1bfbc559-zone2: the decision board (T58) ----
      # The board keeps product intent separate from observed destinations, exposes the
      # questions and suggestions, and does not apply choices without a recorded decision.
      - name: Rebuild the decision board and confirm committed output is current
        run: python3 tools/build_board.py --check

      - name: Decision-board gate (sourcing, blanks, nothing decided, open questions empty,
              intent/observation separation, derived counts, disclosure, sponsored links, no prices)
        run: python3 tools/validate_board.py

      - name: Decision-board gate negative tests (19 injected defects must each fire)
        run: python3 tools/test_board.py

      # ---- arena/f8e18ca8-zone2: the independent audit namespace ----
      # 1B-2 (session 1b839f87) recorded that nothing in this workflow resolves a CSS url(),
      # which is how the font 404 shipped on every page for weeks. Negative-tested: appending a
      # url() to any stylesheet makes this step fail.
      # ---- arena/7c1511ee-zone2: the review board (T53) ----
      # Four reader/owner surfaces generated from docs/review-board.json: 12 proposals on one scale,
      # 9 open questions, a 16-row requirements trace of the 2026-11-16 request and 5 article concepts.
      # The gate holds them to the project contract (every row sourced or explicitly flagged, an open
      # question never carrying an answer, nothing reading as decided, derived counts, disclosure, links
      # and fragments, no product price) and is negative-tested below: 19 injected defects must each fire.
      - name: Rebuild the review board and confirm committed output is current
        run: python3 tools/build_review_board.py --check

      - name: Review-board gate (sourcing, options, nothing-decided, derived counts, links, no prices)
        run: python3 tools/validate_review_board.py

      - name: Review-board gate negative tests (19 injected defects must each fire)
        run: python3 tools/test_review_board.py

      - name: Every stylesheet url() resolves to a file
        run: python3 tools/check_css_urls.py

      # The audit gate holds audit/ to the same contract as the rest of the repo: every finding
      # is VERIFIED-with-a-source or UNVERIFIED-with-a-reason, a carried source is labelled as
      # carried on the page, every printed count is derived from the data, links and fragments
      # resolve, the disclosure is present, and no page prints a price. Negative-tested by
      # tools/test_audit.py (11 injected defects, each must fire).
      - name: Rebuild the audit pages and confirm committed output is current
        run: python3 tools/build_audit.py --check

      - name: Audit gate (sourcing, carried-source labels, derived counts, links, disclosure)
        run: python3 tools/validate_audit.py

      - name: Audit gate negative tests (11 injected defects must each fire)
        run: python3 tools/test_audit.py
      # ---- arena/d26f42db-zone2: the Owner's Console (T42) ----
      # A decision surface, not a second data store: it indexes the registers other sessions own
      # (SG-, Q-, F-, DS-, RF-) and adds only namespaced rows (P-, IN-, IR-, C-). Same contract as
      # every other gate — every value sourced to an official page, an open question left empty,
      # no price, disclosure on every page, links resolving — plus board integrity: an approved
      # proposal must carry a recorded choice that is one of its own options.
      - name: Rebuild the Owner's Console and confirm committed output is current
        run: python3 tools/build_console.py --check

      - name: Owner's Console gate (sourcing, board integrity, decision sheet, disclosure, links, no prices)
        run: python3 tools/validate_console.py

      # T26: this guard was excluded from CI because it reported seven false failures — it
      # resolved the repository root to research-hub/ and then looked for the root site's
      # files inside the hub. It now resolves both roots correctly and checks 13 pages, so it
      # runs here and its per-row sourcing rule protects the hub's 38 attribute rows.
      - name: Research-hub per-row sourcing guard
        run: python3 research-hub/scripts/verify.py

      - name: Subpages disclose and never print a product price
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          DISCLOSURE = "As an Amazon Associate I earn from qualifying purchases."
          pages = sorted(Path('pages').rglob('*.html'))
          assert len(pages) >= 30, f'expected the full generated subpage set, found {len(pages)}'
          bad = []
          for f in pages:
              text = f.read_text(encoding='utf-8')
              if DISCLOSURE not in text:
                  bad.append(f'{f}: missing the required Site disclosure')
              if 'amazon.com/dp/' in text and 'rel="sponsored' not in text and 'plpRedirect' not in text:
                  bad.append(f'{f}: links to a product page without rel="sponsored"')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'{len(pages)} subpages: disclosure present, sponsored links qualified')
          PY

      # T50 (session arena/9251f262-zone2): the reader-facing front-of-house pages. The build
      # step rewrites them from marketing/data/facts.json, so a hand-edit that is not
      # reproducible from the dataset is caught here; the gate then re-reads the pages as they
      # sit on disk and enforces the sourcing, blank, disclosure, sponsored-link, canonical and
      # no-invented-metrics rules on each one.
      - name: Rebuild the front pages and confirm committed output is current
        run: python3 tools/build_front.py --check

      - name: Front-of-house gate (per-row sourcing, blanks carry a reason, disclosure above
              the data, sponsored links, canonical, no prices, no invented metrics)
        run: python3 tools/verify_front.py

      # T68 (session arena/5f7f77a4-zone2): the five product notes used to share roughly a third of
      # their text (worst pair 0.389 by 8-word shingle Jaccard). This gate measures the same property
      # on the built pages and fails above 0.25, so a future note cannot quietly become a restatement
      # of an existing one. The threshold is this project's own repair budget; no search engine
      # publishes an overlap value, and the page that reports it says so.
      - name: Product-note duplication gate (8-word shingles, Jaccard; fails above 0.25)
        run: python3 tools/note_overlap.py

      # T66 (session arena/75efdf57-zone2): the shop section (shop/**). The build step rewrites
      # every shop page from shop/data/*.json and fails on an unresolvable guide token or a guide
      # quoting a blank/conflicting value; the gate then re-reads the pages on disk: every row and
      # compare cell sourced or blank-with-reason, disclosure strip above <main> and in the footer,
      # product buttons tagged + sponsored + counted by events.js, citations untagged, no prices,
      # no invented metrics, canonical, images with alt text, briefing integrity.
      - name: Rebuild the shop section and confirm committed output is current
        run: python3 tools/build_shop.py --check

      - name: Shop gate (sourcing, disclosure strip, tagged sponsored buttons, untagged citations,
              no prices, no invented metrics, canonical, image alt text, briefing integrity)
        run: python3 tools/validate_shop.py

      - name: Original publication artwork is reproducible
        run: python3 tools/build_artwork.py --check

      - name: Privacy-preserving collector and authorized report import tests
        run: python3 -m unittest discover -s measurement -p 'test_*.py' -v

      - name: Event client privacy and behavior tests
        run: node tests/test_events.cjs

      - name: Price and issued-tag guard regressions
        run: python3 tests/test_price_guards.py && python3 tests/test_link_policy.py

      # T72 (session arena/672f9c4c-zone2, 2026-11-19): D8 in tools/seo_audit.py is the gate that
      # keeps S-04 / RQ-01 shut (every page has its own title and description). These are its
      # negative controls: each of the three pre-T72 defects must fire, and the repaired shape
      # must pass. A gate that has never been shown to fail is not a gate.
      - name: Per-page identity gate negative tests (blank description, duplicate title,
              duplicate description must each fire)
        run: python3 tests/test_page_identity.py

      - name: Publication data and packaging mutation tests
        run: python3 tests/test_publication.py

      - name: Review-only editorial plan smoke test
        run: python3 tools/editorial_plan.py

      - name: Package the deploy artifact
        run: python3 tools/package_site.py

      - name: Deployed publication contract (all pages, sources, links and privacy)
        run: python3 tools/verify_publication.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser verification dependencies
        run: npm ci --no-audit --no-fund

      - name: Browser verification (desktop, mobile, keyboard, accessibility and real local persistence)
        run: node tests/browser.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages settings require Administration:write as well as Pages:write.
      # Do not pretend the deployment token can administer repository settings.
      - name: Report Pages source mode without assuming administrator permission
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            core.info('Pages build_type: ' + response.data.build_type);
            if (response.data.build_type !== 'workflow') {
              core.warning('Legacy branch publishing remains enabled. This job deploys the verified artifact; see CN-08 for the administrator-only source-setting gate.');
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live publication rather than only upload success
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'https://kanlerxz87-cyber.github.io/Zone2/';
            const disclosure = 'As an Amazon Associate I earn from qualifying purchases.';
            const pages = [
              ['', true], ['shop.html', true], ['guides/chefman-dual-basket.html', true],
              ['guides/thermomaven-instant-read.html', true], ['measurement.html', false],
              ['flagged.html', false], ['pages/index.html', false], ['shop/index.html', false]
            ];
            async function read(path) {
              const url = new URL(path, base);
              url.searchParams.set('release', context.sha);
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(20000) });
              if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
              return response.text();
            }
            let error;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const version = JSON.parse(await read('publication-build.json'));
                if (version.schema !== 'counter-notes-build-v1' || version.commit !== context.sha) throw new Error('Public artifact is not the expected source commit');
                for (const [path, indexable] of pages) {
                  const html = await read(path);
                  if (html.split(disclosure).length < 3) throw new Error(path + ': repeated disclosure absent');
                  const strip = html.indexOf('data-disclosure-strip');
                  if (strip < 0 || strip > html.indexOf('<main')) throw new Error(path + ': disclosure not before main');
                  const robots = indexable ? 'index,follow' : 'noindex,follow';
                  if (!html.includes('<meta name="robots" content="' + robots + '">')) throw new Error(path + ': robots state mismatch');
                  const canonical = base + path;
                  const found = Array.from(html.matchAll(/<link rel="canonical" href="([^"]+)">/g), m => m[1]);
                  if (found.length !== 1 || found[0] !== canonical) throw new Error(path + ': canonical mismatch');
                  for (const match of html.matchAll(/<a\b[^>]*href="https:\/\/(?:www\.)?amazon\.com[^"]*"[^>]*>/g)) {
                    if (!/rel="[^"]*\bsponsored\b/.test(match[0])) throw new Error(path + ': unsponsored product anchor');
                  }
                }
                const config = JSON.parse(await read('measurement.json'));
                if (config.enabled !== false || config.endpoint !== null) throw new Error('Pages collection must remain OFF');
                if (!(await read('sitemap.xml')).includes('<urlset')) throw new Error('Canonical sitemap absent');
                if (!(await read('feed.xml')).includes('<rss')) throw new Error('Root RSS absent');
                core.info('Live verification passed: exact source commit, 8 HTML pages, repeated disclosures, sponsorship, robots/canonicals, disabled collection, sitemap and RSS. Read-only requests only.');
                return;
              } catch (failure) {
                error = failure;
                if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw error;
