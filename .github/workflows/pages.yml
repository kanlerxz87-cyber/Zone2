name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files and internal navigation
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s data.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              ids=set()
              refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='script' and 'src' in a: self.refs.append(a['src'])
                  if tag=='link' and a.get('rel')=='stylesheet': self.refs.append(a['href'])
          p=Check(); p.feed(Path('index.html').read_text())
          missing=[x for x in p.refs if not Path(x).is_file()]
          assert not missing, f'Missing asset files: {missing}'
          assert {'app','nav','crumb'} <= p.ids
          js=Path('app.js').read_text()
          assert all(f'data-page="{x}"' in Path('index.html').read_text() for x in ('overview','products','content','optimization','compliance','flagged'))
          assert 'window.ZONE2_DATA' in Path('data.js').read_text()
          print('Static site assets and navigation validated')
          PY
      - name: Rebuild the subpages and confirm committed output is current
        run: python3 tools/build_site.py --check
      - name: Deploy gate - per-row sourcing, blank-or-flagged, disclosure and link audit
        run: python3 tools/validate_data.py
      - name: Run the guard test suite
        run: python3 tests/test_pipeline.py
      - name: Confirm sponsored links are tagged and disclosure is everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          REQUIRED = "As an Amazon Associate I earn from qualifying purchases."
          pages = sorted(Path('pages').rglob('*.html'))
          assert pages, 'pages/ not built'
          problems = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if REQUIRED not in text:
                  problems.append(f'{page}: missing the required Site disclosure')
              for href in re.findall(r'class="sponsored-link"[^>]*href="([^"]*)"|href="([^"]*)"[^>]*class="sponsored-link"', text):
                  link = href[0] or href[1]
                  if 'tag=' not in link and 'amazon.com/dp/' not in link:
                      problems.append(f'{page}: suspicious sponsored link {link[:60]}')
          if REQUIRED not in Path('app.js').read_text(encoding='utf-8'):
              problems.append('app.js: landing dashboard lost the required Site disclosure')
          assert not problems, 'compliance gate failed:\n' + '\n'.join(problems)
          print(f'{len(pages)} pages: disclosure present, no untagged sponsored link')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
