name: Verify site links

# GitHub Pages is configured (in repo Settings) to publish the repository root
# from the `main` branch. This workflow is the CI gate that confirms the static
# site has no broken internal links before/after it lands on `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify internal links
        run: python3 scripts/check_links.py .
